services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bako_store
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "bako_store"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/bako_store"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      DNS_RESOLVER: 127.0.0.11
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
