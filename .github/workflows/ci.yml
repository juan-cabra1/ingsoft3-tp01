name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          mkdir -p backend-coverage
          docker run --rm \
            -e DATABASE_URL="postgresql+psycopg://user:pass@localhost:5432/test_db" \
            -e JWT_SECRET_KEY="ci-test-secret-key" \
            -e WHATSAPP_NUMBER="5490000000000" \
            -v "${{ github.workspace }}/backend-coverage:/out" \
            backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("backend-coverage/coverage.json"))["totals"]
          line_pct = d["covered_lines"] / d["num_statements"] * 100
          branch_pct = d["covered_branches"] / d["num_branches"] * 100 if d.get("num_branches") else 0
          print("### Coverage del backend")
          print("| métrica | % |")
          print("|---|---|")
          print(f"| líneas | {line_pct:.2f}% |")
          print(f"| ramas | {branch_pct:.2f}% |")
          print(f"| combinado (umbral, 28% mínimo) | {d['percent_covered']:.2f}% |")
          PY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Último paso del job: si los tests fallan, el job muere antes y esto nunca corre.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Último paso del job: si los tests fallan, el job muere antes y esto nunca corre.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # El hook pelado despliega la punta de la rama; con &ref le decimos a Render
      # QUÉ commit desplegar: el que este pipeline acaba de verificar. El hook de
      # Render ya trae un ?key=..., por eso va & y no ?.
      # Ojo: Render RECONSTRUYE ese commit desde el repo, no usa la imagen publicada
      # en ghcr.io (eso lo cierra el TP7).
      - name: Disparar deploy en Render (backend + front) — del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://bako-api-qa.onrender.com
          URL_FRONT: https://bako-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            # --max-time en cada curl: un servicio despertando de un cold start acepta
            # la conexión y no contesta; sin tope el job se cuelga hasta el límite del runner.
            # Prueba cuatro cosas: la api viva, la BD (/products la toca), el front servido
            # y el proxy del front hacia SU api (/api/products pasa por nginx).
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/products" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/products" > /dev/null; then
              echo "✅ QA responde (API + BD + front + proxy)"; exit 0
            fi
            echo "intento $i/30: todavía no responde"
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1
