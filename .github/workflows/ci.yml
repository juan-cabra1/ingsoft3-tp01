name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          mkdir -p backend-coverage
          docker run --rm \
            -e DATABASE_URL="postgresql+psycopg://user:pass@localhost:5432/test_db" \
            -e JWT_SECRET_KEY="ci-test-secret-key" \
            -e WHATSAPP_NUMBER="5490000000000" \
            -v "${{ github.workspace }}/backend-coverage:/out" \
            backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("backend-coverage/coverage.json"))["totals"]
          line_pct = d["covered_lines"] / d["num_statements"] * 100
          branch_pct = d["covered_branches"] / d["num_branches"] * 100 if d.get("num_branches") else 0
          print("### Coverage del backend")
          print("| métrica | % |")
          print("|---|---|")
          print(f"| líneas | {line_pct:.2f}% |")
          print(f"| ramas | {branch_pct:.2f}% |")
          print(f"| combinado (umbral, 28% mínimo) | {d['percent_covered']:.2f}% |")
          PY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Último paso del job: si los tests fallan, el job muere antes y esto nunca corre.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}   # la imagen sabe de qué commit sale: /health lo informa
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Último paso del job: si los tests fallan, el job muere antes y esto nunca corre.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}   # la imagen sabe de qué commit sale: /version lo informa
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; solo main despliega
    environment: qa
    steps:
      - name: Bajar el código al runner (para tener scripts/smoke.sh)
        uses: actions/checkout@v6

      # Render no construye nada: EJECUTA la imagen que publicó este mismo pipeline. imgURL le
      # dice cuál (la del commit verificado). --get --data-urlencode la agrega al hook (que ya
      # trae ?key=...) y le codifica los ':' y '/'. La URL del hook va ÚLTIMA: es el único
      # argumento suelto, y --data-urlencode se lleva el valor que tiene al lado.
      - name: Desplegar en QA la IMAGEN del commit (backend + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA corra este commit)
        shell: bash
        env:
          URL_API: https://bako-api-qa.onrender.com
          URL_FRONT: https://bako-front-qa.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
          ENV_NAME: QA
        run: bash scripts/smoke.sh

  integracion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: deploy-qa                           # QA ya corre la imagen de ESTA corrida
    environment: qa                            # de acá salen las credenciales del admin de QA
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Sin `playwright install`: estas pruebas son pedidos HTTP, no abren navegador.
      # --legacy-peer-deps igual que el Dockerfile del front (react-helmet-async pide React <=18).
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://bako-api-qa.onrender.com    # la api, no el front
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}                # el reporte importa MÁS cuando falla
        with:
          name: playwright-report-integracion  # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: integracion                         # si la api está rota, no gastamos un browser en confirmarlo
    environment: qa
    timeout-minutes: 20                        # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y navegador
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://bako-front-qa.onrender.com   # el front de QA
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npx playwright test e2e/tienda.spec.js          # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: e2e                                 # EL gate: sin e2e verde ni siquiera se pide aprobación
    environment: production                    # el workflow SE PAUSA acá hasta que un reviewer apruebe
    # Dos deploys a PROD no deben pisarse. OJO: esto NO ordena la cola de aprobaciones: un job
    # esperando aprobación no está "en cola", está en otro estado. Si hay dos corridas esperando,
    # la vieja se rechaza a mano.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Bajar el código al runner (para tener scripts/smoke.sh)
        uses: actions/checkout@v6

      # Entre que la corrida queda esperando aprobación y alguien la aprueba pueden pasar
      # horas y main se mueve. Sin decir QUÉ imagen, aprobar la corrida del commit A podría
      # desplegar otra cosa. Con imgURL se despliega exactamente la imagen del commit que esta
      # corrida verificó en QA y que el aprobador vio: la MISMA, sin reconstruir nada.
      - name: Desplegar en PROD la MISMA imagen que verificó QA (backend + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD (espera a que PROD corra este commit)
        shell: bash
        env:
          URL_API: https://bako-api-prod.onrender.com
          URL_FRONT: https://bako-front-prod.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
          ENV_NAME: PROD
        run: bash scripts/smoke.sh
